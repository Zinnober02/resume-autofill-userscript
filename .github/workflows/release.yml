name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: 校验 tag 与版本号一致
        run: node scripts/check-version.mjs "$GITHUB_REF_NAME"
      - run: npm run build
      - run: npm test
      - name: 生成发布说明
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      - name: 创建 Release 并附上脚本
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/resume-autofill.user.js \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
